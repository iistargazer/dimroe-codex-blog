name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history so the created/modified-date plugin can read git timestamps.
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Runs the prebuild hook first: links local plugins and installs
        # plugin dependencies, then runs the Quartz build itself.
        run: npm run build

      - name: Verify build output
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }
          test -f public/.nojekyll || { echo "::error::public/.nojekyll missing (Jekyll would mangle the output)"; exit 1; }
          test -f public/404.html || { echo "::error::public/404.html missing"; exit 1; }
          pages=$(find public -name '*.html' | wc -l)
          echo "Built $pages pages"
          test "$pages" -gt 1 || { echo "::error::only one page was built — content is missing"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
